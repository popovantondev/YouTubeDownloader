<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>YouTube Downloader</title><link rel="stylesheet" href="popup.css"></head><body>
<header><img src="icons/icon48.png" width="42" height="42" alt=""><div><h1>YouTube Downloader</h1><span class="version">2.5.0 · Preview</span></div></header>
<main><div class="preferences"><label><span data-key="language">Language</span><select id="language"><option value="en">English</option><option value="ru">Русский</option><option value="de">Deutsch</option></select></label><label><span data-key="theme">Theme</span><select id="theme"><option value="system" data-key="system">System</option><option value="light" data-key="light">Light</option><option value="dark" data-key="dark">Dark</option></select></label></div>
<section><h2 data-key="visibleFormats">Show on YouTube</h2><p data-key="availability">Only qualities available for the current video appear.</p><div id="formats"></div></section>
<details><summary data-key="downloadSettings">Download settings</summary><label class="field"><span data-key="mode">Method</span><select id="mode"><option value="background" data-key="background">Without playback</option><option value="capture" data-key="capture">While playing</option></select></label><label class="field" id="rate-row"><span data-key="rate">Capture speed</span><select id="captureRate"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="refresh" data-key="refresh">Refresh available qualities</button><button id="reset" class="secondary" data-key="reset">Restore defaults</button></details>
<div id="notice" role="status" aria-live="polite"></div></main><footer><a id="guide" target="_blank" rel="noreferrer" data-key="guide">Guide</a><a id="support" href="https://github.com/popovantondev/YouTubeDownloader/issues/new/choose" target="_blank" rel="noreferrer" data-key="support">Report a problem</a></footer>
<script src="settings.js"></script><script src="i18n.js"></script><script src="popup.js"></script></body></html>
