name: Public documentation and extension checks
on:
  push:
  pull_request:
  schedule:
    - cron: '27 7 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check_public_docs.py
      - name: Extension regression tests
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for test in sorted(Path('SOURCE/tests').glob('*.js')):
              # 2.5 WSH installer simulation is obsolete: the shipped installer
              # now uses InstallerEngine. Its real isolated Windows checks
              # are tests/test_installer260.py; results are in CHECKS-260.md.
              if test.name in ('test_sabr_background.js', 'test_install.js'):
                  continue
              subprocess.run(['node', str(test)], check=True)
      - name: Combined desktop routing checks
        run: node tests/test_extension260.js
      - name: Published pages and archives
        if: github.event_name == 'schedule'
        run: python tools/check_public_docs.py --online --published
